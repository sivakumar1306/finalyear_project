name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update GitHub Release with artifacts"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.1"
  JAVA_VERSION: "17"

jobs:
  build-and-release:
    name: Build AAB + split APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # CMake is pulled in during native/plugin builds (e.g. jni). Without this
      # cache, every run re-downloads ~100MB+ of CMake 3.22.1 into the SDK.
      - name: Cache Android SDK CMake / NDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/ndk
          key: android-sdk-native-${{ runner.os }}-cmake-3.22.1-ndk-28.2.13676358
          restore-keys: |
            android-sdk-native-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Resolve version from commit hash
        id: ver
        run: |
          set -euo pipefail
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          SHA_FULL=$(git rev-parse HEAD)
          CODE="${{ github.run_number }}"
          TAG="sha-${SHA_SHORT}"
          ARTIFACT_VER="${SHA_SHORT}"

          echo "version_name=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "artifact_ver=${ARTIFACT_VER}" >> "$GITHUB_OUTPUT"
          echo "sha_full=${SHA_FULL}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} build-name=${SHA_SHORT} build-number=${CODE}"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is required for release builds."
            exit 1
          fi
          if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::KEYSTORE_BASE64 set but KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD incomplete."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          sed -i 's/^[[:space:]]*//' android/key.properties
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" > /dev/null
          echo "SIGNED_WITH=release-keystore" >> "$GITHUB_ENV"
          echo "Release keystore configured (alias=${KEY_ALIAS})."

      - name: Build Play App Bundle (.aab)
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/appbundle \
            --build-name="${{ steps.ver.outputs.version_name }}" \
            --build-number="${{ steps.ver.outputs.version_code }}"

      - name: Build per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate \
            --split-debug-info=build/symbols/apk \
            --build-name="${{ steps.ver.outputs.version_name }}" \
            --build-number="${{ steps.ver.outputs.version_code }}"

      - name: Collect and rename artifacts
        id: artifacts
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.artifact_ver }}"
          OUT="release-out"
          mkdir -p "$OUT"

          AAB_SRC="build/app/outputs/bundle/release/app-release.aab"
          if [[ ! -f "$AAB_SRC" ]]; then
            echo "AAB not found at $AAB_SRC"
            find build/app/outputs -type f \( -name '*.aab' -o -name '*.apk' \) | head -50
            exit 1
          fi
          cp "$AAB_SRC" "$OUT/vital-monitoring-${VER}-play.aab"

          mapfile -t APKS < <(find build/app/outputs -type f -name '*-release.apk' | sort)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "No release APKs found"
            find build/app/outputs -type f -name '*.apk' | head -50
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            base=$(basename "$apk")
            case "$base" in
              *arm64-v8a*)
                cp "$apk" "$OUT/vital-monitoring-${VER}-arm64-v8a.apk"
                ;;
              *armeabi-v7a*)
                cp "$apk" "$OUT/vital-monitoring-${VER}-armeabi-v7a.apk"
                ;;
              *x86_64*)
                cp "$apk" "$OUT/vital-monitoring-${VER}-x86_64.apk"
                ;;
              app-release.apk)
                cp "$apk" "$OUT/vital-monitoring-${VER}-universal.apk"
                ;;
              *)
                cp "$apk" "$OUT/vital-monitoring-${VER}-${base}"
                ;;
            esac
          done

          cat > "$OUT/WHICH_FILE.txt" <<EOF
          Vital Monitoring release artifacts (git ${VER})
          Signed with: ${SIGNED_WITH:-unknown}
          Commit: ${{ steps.ver.outputs.sha_full }}

          =============================================================================
          FILE                                    | USE FOR
          -----------------------------------------------------------------------------
          vital-monitoring-${VER}-play.aab                   | Google Play Store upload (required for Play)
                                                  | Play generates per-device APKs from this.
          -----------------------------------------------------------------------------
          vital-monitoring-${VER}-arm64-v8a.apk              | Most modern Android phones (64-bit ARM)
                                                  | Sideload / direct install. Use this on a real phone.
          -----------------------------------------------------------------------------
          vital-monitoring-${VER}-armeabi-v7a.apk            | Older 32-bit ARM phones only
          -----------------------------------------------------------------------------
          vital-monitoring-${VER}-x86_64.apk                 | Emulators / Waydroid / x86_64 devices
                                                  | Do NOT install on normal phones.
          -----------------------------------------------------------------------------
          vital-monitoring-${VER}-universal.apk              | (If present) All ABIs in one large APK
                                                  | Prefer split APKs above when possible.
          =============================================================================

          Install examples:
            adb install -r vital-monitoring-${VER}-arm64-v8a.apk
            adb install -r vital-monitoring-${VER}-x86_64.apk
            Upload vital-monitoring-${VER}-play.aab under Production / Testing track.
          EOF

          sed -i 's/^          //' "$OUT/WHICH_FILE.txt"
          ls -lah "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: vital-monitoring-${{ steps.ver.outputs.artifact_ver }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

      # Dart symbolication files for --obfuscate builds. Keep private: needed
      # to de-obfuscate Flutter/Dart stack traces from obfuscated releases.
      - name: Upload Dart debug symbols (Actions, private)
        uses: actions/upload-artifact@v4
        with:
          name: vital-monitoring-${{ steps.ver.outputs.artifact_ver }}-dart-symbols
          path: build/symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Vital Monitoring ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.ver.outputs.sha_full }}
          generate_release_notes: true
          body: |
            ## Artifacts (commit `${{ steps.ver.outputs.version_name }}`)

            | File | Purpose |
            |------|---------|
            | `vital-monitoring-${{ steps.ver.outputs.artifact_ver }}-play.aab` | **Google Play** — upload this to Play Console |
            | `vital-monitoring-${{ steps.ver.outputs.artifact_ver }}-arm64-v8a.apk` | **Most phones** (64-bit ARM) sideload |
            | `vital-monitoring-${{ steps.ver.outputs.artifact_ver }}-armeabi-v7a.apk` | Older **32-bit ARM** phones |
            | `vital-monitoring-${{ steps.ver.outputs.artifact_ver }}-x86_64.apk` | **Waydroid / x86_64 emulator** only |

            See attached `WHICH_FILE.txt` for install commands.

            - Git commit: `${{ steps.ver.outputs.sha_full }}`
            - Android versionName (build-name): `${{ steps.ver.outputs.version_name }}`
            - Android versionCode (build-number): `${{ steps.ver.outputs.version_code }}` (CI run number)
            - Signing: `${{ env.SIGNED_WITH || 'debug' }}`
          files: |
            release-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
