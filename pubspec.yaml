name: vital_monitoring
description: "Vital Monitoring Smart Ring Flutter App"
publish_to: 'none'
version: 1.1.13+15

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  permission_handler: ^13.0.1
  path_provider: ^2.1.5
  intl: ^0.20.0
  supabase_flutter: ^2.16.0
  http: ^1.6.0
  speech_to_text: ^7.1.0
  share_plus: ^13.3.0
  health: ^13.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - ring.webp
  # Typography uses the platform system font (no bundled fonts).

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_logo.png"
