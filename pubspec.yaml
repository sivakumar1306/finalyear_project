name: qring_flutter
description: "QRing Smart Ring Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  intl: ^0.19.0
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  http: ^1.6.0
  speech_to_text: ^7.0.0
  share_plus: ^10.0.0
  camera: ^0.11.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - ring.png
    - sundr_logo.png
    - ring_charge.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_logo.png"