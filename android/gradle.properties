org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin disabled until plugins migrate (health 13.3.2 still applies KGP)
# See docs/bugs-fixes/02-built-in-kotlin-migration.md + 03-plugin-kgp-tracker.md
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin incremental compilation fails on Windows when pub-cache (C:) and
# the project (D:) sit on different drives ("this and base files have different roots").
kotlin.incremental=false
ksp.incremental=false
