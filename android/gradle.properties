org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin disabled — speech_to_text 7.4.0 still applies KGP (health removed, now health_connector supports built-in)
# See docs/bugs-fixes/03-plugin-kgp-tracker.md — flip to true when speech_to_text migrates
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin incremental compilation fails on Windows when pub-cache (C:) and
# the project (D:) sit on different drives ("this and base files have different roots").
kotlin.incremental=false
ksp.incremental=false
